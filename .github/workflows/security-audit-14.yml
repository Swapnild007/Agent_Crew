name: Security Audit 14
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-audit-14:
    name: Security Audit 14
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run mandatory 14-point security gate
        run: node scripts/security-audit.mjs
